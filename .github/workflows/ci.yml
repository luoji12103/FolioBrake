name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: guardian
          POSTGRES_PASSWORD: guardian
          POSTGRES_DB: guardian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guardian -d guardian"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - name: Install Python deps
        run: cd backend && pip install -e ".[dev]"
      - name: Create alembic.ini
        run: |
          cat > backend/alembic.ini << 'EOF'
          [alembic]
          script_location = app/db/migrations
          sqlalchemy.url = postgresql+psycopg://guardian:guardian@localhost:5432/guardian
          [loggers]
          keys = root,sqlalchemy,alembic
          [handlers]
          keys = console
          [formatters]
          keys = generic
          [logger_root]
          level = WARN
          handlers = console
          [logger_sqlalchemy]
          level = WARN
          handlers =
          qualname = sqlalchemy.engine
          [logger_alembic]
          level = INFO
          handlers =
          qualname = alembic
          [handler_console]
          class = StreamHandler
          args = (sys.stderr,)
          level = NOTSET
          formatter = generic
          [formatter_generic]
          format = %(levelname)-5.5s [%(name)s] %(message)s
          datefmt = %H:%M:%S
          EOF
      - name: Run migrations
        run: cd backend && alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://guardian:guardian@localhost:5432/guardian
      - name: Run tests
        run: cd backend && pytest -v --tb=short
        env:
          DATABASE_URL: postgresql+psycopg://guardian:guardian@localhost:5432/guardian

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        run: cd frontend && npm ci
      - name: Type check
        run: cd frontend && npx tsc --noEmit
      - name: Build
        run: cd frontend && npm run build
