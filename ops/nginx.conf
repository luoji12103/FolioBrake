"""NGINX reverse proxy configuration for production deployment.

Routes /api/* to FastAPI backend, /* to frontend static files.
"""
cat > /tmp/nginx_config.txt << 'NGINX_EOF'
server {
    listen 80;
    server_name _;

    # Frontend static files
    root /app/frontend/dist;
    index index.html;

    # API proxy to FastAPI backend
    location /api/ {
        proxy_pass http://api-server:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA fallback — serve index.html for all non-file, non-API routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip compression
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
}
NGINX_EOF
echo "NGINX config template created"
