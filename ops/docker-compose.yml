name: retail-etf-guardian-backend

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: guardian
      POSTGRES_DB: guardian
    ports:
      - "5433:5432"
    volumes:
      - guardian_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian -d guardian"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - guardian_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-server:
    build:
      context: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://guardian:guardian@postgres:5432/guardian
      REDIS_URL: redis://redis:6379/0
      APP_ENV: dev
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api-server
    restart: unless-stopped

  celery-worker:
    build:
      context: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://guardian:guardian@postgres:5432/guardian
      REDIS_URL: redis://redis:6379/0
      APP_ENV: dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    restart: unless-stopped

  celery-beat:
    build:
      context: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://guardian:guardian@postgres:5432/guardian
      REDIS_URL: redis://redis:6379/0
      APP_ENV: dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel=info"]
    restart: unless-stopped

volumes:
  guardian_postgres:
  guardian_redis:
  prometheus_data:
